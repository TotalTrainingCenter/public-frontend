<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <!--
          종합 훈련 센터 심볼 마크.
          앱 부팅 전에 보이는 스플래시라 인라인으로 둔다.
          원본: src/assets/images/brand/logo-mark.svg
          색은 --initial-loader-color 를 따라간다(테마 primary).
        -->
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M33.79 17.57 A14 14 0 1 1 22.43 6.21"
            stroke="var(--initial-loader-color)" stroke-width="3.6"
            stroke-linecap="round" stroke-dasharray="8 6.17" />
          <path d="M12.5 19.5 L18.5 25.5 L34 9"
            stroke="var(--initial-loader-color)" stroke-width="3.6"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class=" loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const loaderColor = localStorage.getItem('vuexy-initial-loader-bg') || '#FFFFFF'
    const primaryColor = localStorage.getItem('vuexy-initial-loader-color') || '#7367F0'

    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)
    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

    if (primaryColor)
      document.documentElement.style.setProperty('--initial-loader-color', primaryColor)
    </script>
  </body>
