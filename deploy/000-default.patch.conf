# /etc/apache2/sites-available/000-default.conf
#
# 맨 앞 블록(www + apex)을 아래로 교체한다.
# 기존에는 apex·www 를 total 로 301 시켰지만, 이제 apex 가 공개 소개 사이트다.
#
# ⚠️ prepare / beta / private-beta 는 total 로 보내던 기존 동작을 유지했다.
#    이 서브도메인들까지 공개 사이트로 보내려면 아래 두 번째 블록에서 옮길 것.

# ── apex + www : HTTPS 로만 승격. 목적지 변경은 default-ssl.conf 가 담당한다.
<VirtualHost *:80>
    ServerName training-center.org
    ServerAlias www.training-center.org

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/?(.*) https://training-center.org/$1 [R=301,L]
</VirtualHost>

# ── 기존 테스트 서브도메인은 그대로 total 로
<VirtualHost *:80>
    ServerName prepare.training-center.org
    ServerAlias beta.training-center.org private-beta.training-center.org

    RewriteEngine On
    RewriteRule ^/?(.*) https://total.training-center.org/$1 [R=301,L]
</VirtualHost>

# (이하 auth / mypage / total / esoteric / employee / owner / api / policy /
#  jenkinsci 블록은 손대지 않는다)
