# /etc/apache2/sites-available/default-ssl.conf
#
# 맨 앞 블록(www + apex + prepare/beta/private-beta → total 301)을
# 아래 세 블록으로 교체한다.

# ── www : apex 로 301. 정본 주소를 하나로 모은다.
#    둘 다 200 을 주면 중복 콘텐츠로 평가가 갈린다.
<VirtualHost *:443>
    ServerName www.training-center.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/training-center.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/training-center.org/privkey.pem

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://training-center.org/$1 [R=301,L]
</VirtualHost>

# ── 테스트 서브도메인은 기존대로 total 로 (동작 변경 없음)
<VirtualHost *:443>
    ServerName prepare.training-center.org
    ServerAlias beta.training-center.org private-beta.training-center.org

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/training-center.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/training-center.org/privkey.pem

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://total.training-center.org/$1 [R=301,L]
</VirtualHost>

# ── apex : 공개 소개 사이트 (정본)
#
# ⚠️ AllowOverride 가 켜져 있어야 한다. 라우팅은 dist/.htaccess 가 담당하며,
#    거기서 프리렌더 스냅샷(dist/<route>/index.html)을 먼저 서빙한다.
#    AllowOverride None 이면 하위 경로가 전부 404 가 된다.
#    (total 사이트도 .htaccess 로 SPA fallback 을 하고 있으니 이미 켜져 있을 것이다)
<VirtualHost *:443>
    ServerName training-center.org

    DocumentRoot /var/www/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/training-center.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/training-center.org/privkey.pem

    CBandPeriod 1D
    CustomLog ${APACHE_LOG_DIR}/training-center.org.log combined
</VirtualHost>

# (이하 auth / mypage / total / esoteric / employee / owner / api / policy /
#  jenkinsci 블록은 손대지 않는다)
