# ═══════════════════════════════════════════════════════════════
#  공개 소개 사이트 vhost
#  배포 위치: /etc/apache2/sites-available/training-center.conf
#  적용:      a2ensite training-center && systemctl reload apache2
#
#  ⚠️ 기존에 apex/www → total 로 걸려 있는 301 을 반드시 먼저 제거할 것.
#     그 리다이렉트가 남아 있으면 이 vhost 는 동작하지 않는다.
# ═══════════════════════════════════════════════════════════════

# 1) www → apex 301 (정본 주소 일원화. 둘 다 200 이면 중복 콘텐츠)
<VirtualHost *:443>
    ServerName www.training-center.org
    Redirect permanent / https://training-center.org/

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/training-center.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/training-center.org/privkey.pem
</VirtualHost>

# 2) apex = 공개 소개 사이트 (정본)
<VirtualHost *:443>
    ServerName training-center.org
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # 프리렌더된 정적 HTML 을 우선 서빙한다.
        # /about        → /about/index.html   (정적 스냅샷, 크롤러가 보는 것)
        # 매칭 실패 시에만 SPA fallback.
        RewriteEngine On
        RewriteBase /

        # 실제 파일/디렉터리는 그대로
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # 프리렌더 스냅샷이 있으면 그것을 서빙
        RewriteCond %{DOCUMENT_ROOT}/$1/index.html -f
        RewriteRule ^(.*?)/?$ /$1/index.html [L]

        # 그 외에는 SPA fallback
        RewriteRule ^ /index.html [L]
    </Directory>

    # 정적 자산 장기 캐시 / HTML 은 캐시 금지 (배포 즉시 반영)
    <FilesMatch "\.(js|css|woff2|png|jpg|jpeg|webp|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(html|xml|txt)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/training-center.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/training-center.org/privkey.pem
</VirtualHost>

# 3) HTTP → HTTPS
<VirtualHost *:80>
    ServerName training-center.org
    ServerAlias www.training-center.org
    RewriteEngine On
    RewriteRule ^ https://training-center.org%{REQUEST_URI} [R=301,L]
</VirtualHost>
